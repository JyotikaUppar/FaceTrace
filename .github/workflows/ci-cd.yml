name: FaceTrace Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

defaults:
  run:
    working-directory: Face_recognition_Finding_missing_people-master

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Code Syntax & Automated Unit Testing
  # -------------------------------------------------------------
  test-and-lint:
    name: 1. Code Lint & Automated Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Person Service Unit Tests
        run: |
          cd services/person-service
          node --test test/person.test.js

      - name: Run Location Service Unit Tests
        run: |
          cd services/location-service
          node --test test/location.test.js

      - name: Setup Python (v3.9)
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Verify AI Recognition Script Compilation & Unit Tests
        run: |
          python -m py_compile face_recognition/apicall.py
          python -m py_compile face_recognition/imagesapi.py
          python -m py_compile face_recognition/main.py
          cd face_recognition
          python -m unittest test_apicall.py

  # -------------------------------------------------------------
  # STAGE 2: Docker Build & Compose Validation
  # -------------------------------------------------------------
  docker-validation:
    name: 2. Docker Build & Compose Validation
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Build Core Microservices Images
        run: |
          docker compose build person-service location-service notification-service gateway

  # -------------------------------------------------------------
  # STAGE 3: Kubernetes Manifest Dry-Run Validation
  # -------------------------------------------------------------
  k8s-validation:
    name: 3. Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    needs: docker-validation

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup kubectl CLI
        uses: azure/setup-kubectl@v3

      - name: Validate Kubernetes Manifests Syntax (Dry Run)
        run: |
          kubectl apply --dry-run=client -f k8s/01-namespace-config.yaml
          kubectl apply --dry-run=client -f k8s/02-databases.yaml
          kubectl apply --dry-run=client -f k8s/03-microservices.yaml
          kubectl apply --dry-run=client -f k8s/04-ingress-gateway.yaml

