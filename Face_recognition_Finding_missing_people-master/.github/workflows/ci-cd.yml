name: FaceTrace End-to-End CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

defaults:
  run:
    working-directory: Face_recognition_Finding_missing_people-master

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Code Linting & Automated Unit Testing
  # -------------------------------------------------------------
  lint-and-test:
    name: 1. Code Lint & Automated Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v18)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Run Person Service Unit Tests
        run: |
          cd services/person-service
          npm ci || npm install
          npm test

      - name: Install & Run Location Service Unit Tests
        run: |
          cd services/location-service
          npm ci || npm install
          npm test

      - name: Setup Python (v3.9)
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Verify & Test AI Recognition Script Compilation
        run: |
          python -m py_compile face_recognition/apicall.py
          python -m py_compile face_recognition/imagesapi.py
          python -m py_compile face_recognition/main.py
          cd face_recognition
          python -m unittest test_apicall.py

  # -------------------------------------------------------------
  # STAGE 2: Security & SAST Scans
  # -------------------------------------------------------------
  security-sast:
    name: 2. CI/CD Security Checks & Vulnerability Scanning
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Node Dependency Security Audit
        run: |
          cd services/person-service && npm audit --audit-level=high || true
          cd ../location-service && npm audit --audit-level=high || true
          cd ../notification-service && npm audit --audit-level=high || true

      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: 'Face_recognition_Finding_missing_people-master/services/person-service/Dockerfile'
          ignore: 'DL3007,DL3018'

  # -------------------------------------------------------------
  # STAGE 3: Optimized Docker Build & Artifact Tagging
  # -------------------------------------------------------------
  docker-build-and-tag:
    name: 3. Build Automation & Artifact Versioning
    runs-on: ubuntu-latest
    needs: security-sast

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (Cache Optimization)
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build & Tag Container Artifacts
        run: |
          BUILD_TAG="v1.0.0-${GITHUB_SHA:0:7}"
          echo "Building microservice artifacts tagged as $BUILD_TAG"
          docker compose build person-service location-service notification-service

  # -------------------------------------------------------------
  # STAGE 4: Blue-Green Deployment & Verification
  # -------------------------------------------------------------
  deploy-simulation:
    name: 4. Deployment Pipeline & Blue-Green Simulation
    runs-on: ubuntu-latest
    needs: docker-build-and-tag

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Execute Blue-Green Zero-Downtime Deployment
        run: |
          chmod +x scripts/blue-green-deploy.sh
          ./scripts/blue-green-deploy.sh green
