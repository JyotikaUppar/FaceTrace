# -------------------------------------------------------------
# Person Registry Microservice
# -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: person-service
  namespace: facetrace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: person-service
  template:
    metadata:
      labels:
        app: person-service
    spec:
      containers:
        - name: person-service
          image: docker.io/facetrace/person-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: facetrace-config
                  key: PORT_PERSON
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: facetrace-secrets
                  key: MONGO_PERSON_URI
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: person-service
  namespace: facetrace
spec:
  ports:
    - port: 5001
      targetPort: 5001
  selector:
    app: person-service
---
