events {
    worker_connections 1024;
}

http {
    upstream person_service {
        server person-service:5001;
    }

    upstream location_service {
        server location-service:5002;
    }

    upstream notification_service {
        server notification-service:5003;
    }

    upstream frontend_service {
        server frontend:3000;
    }

    server {
        listen 80;

        server_name localhost;

        # Health Check Endpoint
        location /health {
            default_type application/json;
            return 200 '{"status":"OK", "gateway":"Nginx API Gateway"}';
        }

        # Person Service Routes
        location /api/missingpeople {
            proxy_pass http://person_service/api/missingpeople;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Location Service Routes
        location /api/foundlocation {
            proxy_pass http://location_service/api/foundlocation;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification Service Routes
        location /api/notifications {
            proxy_pass http://notification_service/api/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React Dashboard Frontend
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
