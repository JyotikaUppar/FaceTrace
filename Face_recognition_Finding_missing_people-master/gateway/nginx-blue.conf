events { worker_connections 1024; }
http {
    upstream person_service { server person-service-blue:5001; }
    upstream location_service { server location-service-blue:5002; }
    upstream notification_service { server notification-service-blue:5003; }
    upstream frontend_service { server frontend:3000; }
    server {
        listen 80;
        location /api/missingpeople { proxy_pass http://person_service/api/missingpeople; }
        location /api/foundlocation { proxy_pass http://location_service/api/foundlocation; }
        location /api/notifications { proxy_pass http://notification_service/api/notifications; }
        location / { proxy_pass http://frontend_service; }
    }
}
